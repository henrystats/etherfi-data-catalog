name: Studio production build and deploy

on:
  workflow_call:
    secrets:
      DUNE_API_KEY:
        description: Read-only key used to import latest stored Dune results
        required: true

permissions: {}

concurrency:
  group: studio-production-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require read-only Dune API secret
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "::error::DUNE_API_KEY is required. Add it as a repository Actions secret with read-only Dune access." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check Studio query inventory
        run: python scripts/generate_studio_inventory.py --check

      - name: Seed previous-good Studio snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/studio-live-generated"
          cp -R website/data/studio/generated/. "$RUNNER_TEMP/studio-live-generated/"

      - name: Fetch latest stored Studio results and promote validated snapshot
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          STUDIO_ENABLE_LIVE_DUNE: "1"
        run: |
          python scripts/fetch_studio_data.py \
            --output-dir "$RUNNER_TEMP/studio-live-generated" \
            --keep-previous 1 \
            --force \
            --verbose

      - name: Validate promoted Studio snapshot
        run: |
          python scripts/fetch_studio_data.py \
            --validate-only \
            --output-dir "$RUNNER_TEMP/studio-live-generated"

      - name: Fetch latest stored catalog freshness result
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python scripts/update_freshness_from_dune.py --query-id 7625551

      - name: Run complete tests
        run: python -m pytest -q

      - name: Build website from validated live Studio snapshot
        run: >-
          python scripts/build_website.py
          --studio-generated-data "$RUNNER_TEMP/studio-live-generated"

      - name: Upload failed-refresh diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-live-refresh-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/studio-live-generated/state.json
            ${{ runner.temp }}/studio-live-generated/attempts/*/attempt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
