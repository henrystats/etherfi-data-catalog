name: Build and deploy website from Studio snapshot

on:
  workflow_call:
    inputs:
      studio_run_id:
        description: Optional successful Studio snapshot workflow run to consume
        required: false
        type: string
        default: ""
    secrets:
      DUNE_API_KEY:
        description: Read-only key used to import the latest catalog freshness result
        required: true

permissions: {}

concurrency:
  group: studio-production-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require read-only Dune API secret
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "::error::DUNE_API_KEY is required. Add it as a repository Actions secret with read-only Dune access." >&2
            exit 1
          fi

      - name: Resolve validated Studio snapshot run
        id: studio-run
        uses: actions/github-script@v9
        env:
          REQUESTED_RUN_ID: ${{ inputs.studio_run_id }}
          STUDIO_WORKFLOW_PATH: studio-live-refresh.yml
          REQUIRED_BRANCH: main
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedRunId = process.env.REQUESTED_RUN_ID.trim();
            const workflowPath = process.env.STUDIO_WORKFLOW_PATH;
            const requiredBranch = process.env.REQUIRED_BRANCH;
            const expectedRepository = `${owner}/${repo}`;
            const expectedPath = `.github/workflows/${workflowPath}`;
            const trustedEvents = new Set(["schedule", "workflow_dispatch"]);
            const trustedPaths = new Set([
              expectedPath,
              `${expectedPath}@${requiredBranch}`,
            ]);
            const isTrustedRun = (candidate) => (
              candidate.status === "completed"
              && candidate.conclusion === "success"
              && candidate.head_branch === requiredBranch
              && trustedPaths.has(candidate.path)
              && candidate.head_repository?.full_name === expectedRepository
              && trustedEvents.has(candidate.event)
            );
            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowPath,
              branch: requiredBranch,
              status: "success",
              per_page: 10,
            });
            const eligibleRuns = runsResponse.data.workflow_runs
              .filter(isTrustedRun)
              .sort((left, right) => right.id - left.id);
            const newestRun = eligibleRuns[0];
            if (!newestRun) {
              throw new Error("No successful Studio snapshot workflow run is available.");
            }

            let run = newestRun;
            if (requestedRunId) {
              if (!/^\d+$/.test(requestedRunId)) {
                throw new Error("The requested Studio workflow run ID is invalid.");
              }
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(requestedRunId),
              });
              run = response.data;
            }
            if (!isTrustedRun(run)) {
              throw new Error(
                `Studio run ${run.id} is not a successful trusted ${requiredBranch} snapshot run.`,
              );
            }
            if (run.id !== newestRun.id) {
              throw new Error(
                `Studio run ${run.id} is older than newest eligible run ${newestRun.id}.`,
              );
            }

            const artifactName = `studio-live-snapshot-${run.id}-${run.run_attempt}`;
            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              name: artifactName,
              per_page: 100,
            });
            const artifacts = artifactsResponse.data.artifacts.filter((artifact) => (
              artifact.name === artifactName && artifact.expired === false
            ));
            if (artifacts.length !== 1) {
              throw new Error(
                `Expected one active ${artifactName} artifact for Studio run ${run.id}.`,
              );
            }
            core.setOutput("run_id", String(run.id));
            core.setOutput("artifact_id", String(artifacts[0].id));
            core.setOutput("artifact_name", artifactName);
            return String(run.id);

      - name: Download validated Studio snapshot
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.studio-run.outputs.artifact_id }}
          path: ${{ runner.temp }}/studio-live-generated
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.studio-run.outputs.run_id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check Studio query inventory
        run: python scripts/generate_studio_inventory.py --check

      - name: Validate downloaded Studio snapshot
        run: |
          python scripts/fetch_studio_data.py \
            --validate-only \
            --output-dir "$RUNNER_TEMP/studio-live-generated"

      - name: Fetch latest stored catalog freshness result
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python scripts/update_freshness_from_dune.py --query-id 7625551

      - name: Run complete tests
        run: python -m pytest -q

      - name: Build website from validated Studio snapshot
        run: >-
          python scripts/build_website.py
          --studio-generated-data "$RUNNER_TEMP/studio-live-generated"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
