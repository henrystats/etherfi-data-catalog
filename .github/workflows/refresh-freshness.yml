name: Refresh catalog freshness and deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  workflow_run:
    workflows:
      - Refresh live Studio data snapshot
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  production-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/studio-production-deploy.yml
    with:
      studio_run_id: ${{ format('{0}', github.event.workflow_run.id || '') }}
    secrets:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
