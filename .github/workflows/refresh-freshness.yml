name: Validate catalog freshness import

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: catalog-freshness-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-freshness-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch latest stored catalog freshness result
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "::error::DUNE_API_KEY is required. Add it as a repository Actions secret with read-only Dune access." >&2
            exit 1
          fi
          python scripts/update_freshness_from_dune.py \
            --query-id 7625551 \
            --output "$RUNNER_TEMP/dataset_freshness.yaml"

      - name: Upload freshness validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-freshness-${{ github.run_id }}
          path: ${{ runner.temp }}/dataset_freshness.yaml
          if-no-files-found: error
          retention-days: 1
