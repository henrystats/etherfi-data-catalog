name: Validate Studio fixture refresh

on:
  workflow_dispatch:
    inputs:
      confirm_fixture_refresh:
        description: Run the offline Studio fixture refresh and validation workflow
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-fixture-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-refresh:
    if: ${{ inputs.confirm_fixture_refresh == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check Studio query inventory
        run: python scripts/generate_studio_inventory.py --check

      - name: Build deterministic fixture snapshot
        run: |
          python scripts/fetch_studio_data.py \
            --fixture-mode \
            --fixture-scenario success \
            --fixture-now 2026-07-31T12:00:00Z \
            --output-dir website/data/studio/generated \
            --keep-previous 1 \
            --verbose

      - name: Validate active fixture snapshot
        run: |
          python scripts/fetch_studio_data.py \
            --validate-only \
            --output-dir website/data/studio/generated

      - name: Run complete tests
        run: python -m pytest -q

      - name: Build website
        run: python scripts/build_website.py

      - name: Upload fixture diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-fixture-refresh-${{ github.run_id }}
          path: |
            website/data/studio/generated/state.json
            website/data/studio/generated/snapshots/
            website/data/studio/generated/attempts/
            output/website/data/studio/generated/
          if-no-files-found: warn
          retention-days: 7
