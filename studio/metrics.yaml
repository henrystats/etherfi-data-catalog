  - id: kyber_referral_deposits_growth
    dashboard_id: kyberswap_campaign
    name: Referral Deposits
    description: Daily or weekly referral deposits alongside cumulative campaign deposits.
    section: trends
    visualization_type: line
    query_id: 8191379
    query_url: https://dune.com/queries/8191379
    data_file: query_8191379.json
    columns: &kyberswap_growth_deposits_columns
      [record_type, period, day, observation_day, week, daily_deposits_usd, weekly_deposits_usd, cum_deposits_usd, last_updated, source_query_id, source_execution_id, source_last_updated, generated_at]
    dimension_columns: &kyberswap_growth_deposits_dimensions
      [record_type, period, day, observation_day, week, last_updated, source_query_id, source_execution_id, source_last_updated, generated_at]
    value_columns: &kyberswap_growth_deposits_values
      [daily_deposits_usd, weekly_deposits_usd, cum_deposits_usd]
    data_source: kyberswap_growth_deposits
    provider_mode: latest_result
    transformation: &kyberswap_growth_deposits_transformation
      id: kyberswap_growth_deposits
      version: 1.0.0
      methodology_id: kyberswap_growth_deposits_v1
      script_path: scripts/enrich_kyberswap_growth.py
      tests_path: tests/test_kyberswap_growth.py
      fixture_path: studio/fixtures/query_8191379.json
      raw_data_file: raw_query_8191379.json
      source_required_columns: [day, week, daily_deposits_usd, weekly_deposits_usd, cum_deposits_usd, last_updated]
    methodology:
      title: Referral Deposits
      description: Period referral deposits and cumulative campaign deposits are prepared from the latest stored query result and displayed together on separate USD axes.
      metric_definitions:
        - Daily columns use daily_deposits_usd and the line uses cum_deposits_usd.
        - Weekly columns use weekly_deposits_usd from the latest available day in each week; that same row supplies the cumulative line.
      selected_period_logic:
        - The dashboard period filters prepared source dates before the selected daily or weekly view is shown.
        - An incomplete current week uses its latest available observation and weekly_deposits_usd is never summed across repeated daily rows.
      notes:
        - Both axes are USD; the left axis is period deposits and the right axis is cumulative deposits.
        - Python validates non-negative deposits, non-decreasing cumulative values, dates, weeks, and source last_updated.
    growth_chart:
      kind: combo
      default_granularity: weekly
      period_column: period
      range_date_column: observation_day
      available_granularities: [daily, weekly]
      default_view: deposits
      views:
        - id: deposits
          label: Deposits
          record_types: {daily: daily, weekly: weekly}
          series_label: Referral deposits
      measures:
        - {column_by_granularity: {daily: daily_deposits_usd, weekly: weekly_deposits_usd}, label: Period referral deposits, format: currency_compact, series_type: column, axis: left, color: green}
        - {column: cum_deposits_usd, label: Cumulative referral deposits, format: currency_compact, series_type: line, axis: right, color: blue}
      export_columns: [period, period_deposits_usd, cumulative_deposits_usd, granularity, source_last_updated]
      export_aliases: {period: period, period_deposits_usd: primary_value, cumulative_deposits_usd: secondary_value, granularity: granularity, source_last_updated: source_last_updated}
    source_label: Methodology
    export_name: Referral Deposits
    export_slug: kyberswap-referral-deposits-growth
    last_updated: generated
    is_exportable: true
    default_visible: true
    display_order: 9
    format: currency_compact
    size: medium
    date_column: period
    default_visualization: line
    allowed_visualizations: [line]
    series:
      - {column: daily_deposits_usd, label: Period referral deposits, color: green}
      - {column: cum_deposits_usd, label: Cumulative referral deposits, color: blue}

  - id: kyber_attributed_tvl_over_time
    dashboard_id: kyberswap_campaign
    name: Attributed TVL Over Time
    description: Referral-attributed capital still held across ether.fi positions.
    section: trends
    visualization_type: line
    query_id: 8191704
    query_url: https://dune.com/queries/8191704
    data_file: query_8191704.json
    columns: &kyberswap_growth_tvl_columns
      [record_type, period, day, observation_day, week, depositor_type, daily_attributed_tvl_usd, cum_attributed_tvl_usd, source_query_id, source_execution_id, source_last_updated, generated_at]
    dimension_columns: &kyberswap_growth_tvl_dimensions
      [record_type, period, day, observation_day, week, depositor_type, source_query_id, source_execution_id, source_last_updated, generated_at]
    value_columns: &kyberswap_growth_tvl_values [daily_attributed_tvl_usd, cum_attributed_tvl_usd]
    data_source: kyberswap_growth_attributed_tvl
    provider_mode: latest_result
    transformation: &kyberswap_growth_tvl_transformation
      id: kyberswap_growth_attributed_tvl
      version: 1.0.0
      methodology_id: kyberswap_growth_attributed_tvl_v1
      script_path: scripts/enrich_kyberswap_growth.py
      tests_path: tests/test_kyberswap_growth.py
      fixture_path: studio/fixtures/query_8191704.json
      raw_data_file: raw_query_8191704.json
      source_required_columns: [day, week, depositor_type, daily_attributed_tvl_usd, cum_attributed_tvl_usd]
    methodology:
      title: Attributed TVL Over Time
      description: Attributed TVL is prepared as either one total series or separate depositor-type series from the latest stored result.
      metric_definitions:
        - All mode uses one repeated cum_attributed_tvl_usd value per day and validates that depositor-type rows agree.
        - Depositor Type mode uses daily_attributed_tvl_usd for New Depositor, Existing Depositor, Past Depositor, and any validated source categories.
      selected_period_logic:
        - Weekly TVL selects the latest available observation in each week rather than summing TVL across days.
        - The dashboard period filters prepared observations before rendering.
      notes:
        - Area mode stacks depositor-type series while Line mode renders separate non-stacked lines; All is a single series in both modes.
        - Values are USD and the Python transformation validates the repeated total, classifications, dates, and non-negative values.
    growth_chart:
      kind: timeseries
      default_granularity: weekly
      period_column: period
      range_date_column: observation_day
      available_granularities: [daily, weekly]
      default_view: all
      views:
        - id: all
          label: All
          record_types: {daily: daily_all, weekly: weekly_all}
          series_label: Attributed TVL
          value_column: cum_attributed_tvl_usd
        - id: depositor_type
          label: Depositor Type
          record_types: {daily: daily_depositor_type, weekly: weekly_depositor_type}
          dimension_column: depositor_type
          dimension_order: [New Depositor, Existing Depositor, Past Depositor]
          value_column: daily_attributed_tvl_usd
      measures:
        - {column: cum_attributed_tvl_usd, label: Attributed TVL, format: currency_compact, series_type: area, color: green, stack: true}
      export_columns: [period, grouping_mode, depositor_type, attributed_tvl_usd, granularity]
      export_aliases: {period: period, grouping_mode: selected_view, depositor_type: dimension, attributed_tvl_usd: primary_value, granularity: granularity}
    source_label: Methodology
    export_name: Attributed TVL Over Time
    export_slug: kyberswap-attributed-tvl-over-time
    last_updated: generated
    is_exportable: true
    default_visible: true
    display_order: 10
    format: currency_compact
    size: medium
    date_column: period
    default_visualization: area
    allowed_visualizations: [area, line]
    series:
      - {column: cum_attributed_tvl_usd, label: Attributed TVL, color: green}

