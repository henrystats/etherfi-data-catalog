      script_path: scripts/enrich_kyberswap_growth.py
      tests_path: tests/test_kyberswap_growth.py
      fixture_path: studio/fixtures/query_8193003.json
      raw_data_file: raw_query_8193003.json
      source_required_columns: [day, week, product_symbol, depositor_type, daily_deposits]
    methodology: &kyberswap_growth_breakdown_methodology
      title: Referral Deposits Breakdown
      description: Referral deposit flows are transformed into product and depositor-type views while retaining USD precision.
      metric_definitions:
        - Daily product and depositor-type views sum daily_deposits at their respective source grains.
        - Weekly views sum the daily USD flows across each week; Product and Depositor Type change grouping rather than filtering one category.
      selected_period_logic:
        - The dashboard period filters daily source dates before weekly grouping or total aggregation.
        - The total ranking sums only dates inside the active dashboard period and sorts categories by descending USD value.
      notes:
        - Product order prefers eETH, liquidETH, liquidUSD, and liquidBTC; depositor types prefer New, Existing, and Past Depositor while preserving validated unexpected categories.
        - The time-series view is always stacked columns and the total view is always horizontal bars.
    growth_chart:
      kind: timeseries
      default_granularity: weekly
      period_column: period
      rebuild_weekly_from_daily: true
      available_granularities: [daily, weekly]
      default_view: product
      views:
        - id: product
          label: Product
          record_types: {daily: daily_product, weekly: weekly_product}
          dimension_column: product_symbol
          dimension_order: [eETH, liquidETH, liquidUSD, liquidBTC]
          value_column: daily_deposits
        - id: depositor_type
          label: Depositor Type
          record_types: {daily: daily_depositor_type, weekly: weekly_depositor_type}
          dimension_column: depositor_type
          dimension_order: [New Depositor, Existing Depositor, Past Depositor]
          value_column: daily_deposits
      measures:
        - {column: daily_deposits, label: Referral deposits, format: currency_compact, series_type: column, color: green, stack: true}
      export_columns: [period, category_type, category, deposits_usd, granularity]
      export_aliases: {period: period, category_type: selected_view, category: dimension, deposits_usd: primary_value, granularity: granularity}
    source_label: Methodology
    export_name: Referral Deposits Breakdown
    export_slug: kyberswap-referral-deposits-breakdown
    last_updated: generated
    is_exportable: true
    default_visible: true
    display_order: 11
