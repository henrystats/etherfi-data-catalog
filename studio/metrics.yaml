    intelligence_component: wallet_investigation
    provider_mode: latest_result
    transformation: *kyberswap_attributed_holdings_transformation
    methodology:
      title: Wallet investigation
      description: One deterministic local wallet index joins attributed positions, referral-deposit history, and later ether.fi activity from the three latest stored query results.
      definitions:
        - Attributed TVL uses the existing tested Python allocation; existing balances and excess non-referral balances are excluded.
        - Synthetic Exited rows represent the portion of referral deposits no longer supported by active attributed positions.
      business_rules:
        - Deposit history and later activity remain separate read-only source streams and keep full signed source values.
        - Wallet selection filters the local address index and never queries Dune from the browser.
      validation:
        - Address summaries reconcile to the enriched attribution source and indexed row positions are validated before snapshot promotion.
      notes:
        - Shareable wallet state uses a validated EVM address in the wallet URL parameter.
    related_query_urls:
      - https://dune.com/queries/8199058
