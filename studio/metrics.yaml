    section: counters
    visualization_type: counter
    query_id: 8180894
    query_url: https://dune.com/queries/8180894
    data_file: query_8180894.json
    columns: &kyberswap_campaign_summary_columns
      - rank_
      - key_
      - total_deposits_usd
      - outstanding_balance_usd
      - num_depositors
      - new_depositors
      - deposits_by_new_depositors
      - retention_rate
      - depositors_new_users_rate
      - revenue_generated
      - source_query_id
      - source_execution_id
      - source_last_updated
      - generated_at
    dimension_columns: &kyberswap_campaign_summary_dimensions
      - rank_
      - key_
      - source_query_id
      - source_execution_id
      - source_last_updated
      - generated_at
    value_columns: &kyberswap_campaign_summary_values
      - total_deposits_usd
      - outstanding_balance_usd
      - num_depositors
      - new_depositors
      - deposits_by_new_depositors
      - retention_rate
      - depositors_new_users_rate
      - revenue_generated
    data_source: kyberswap_campaign_summary
    provider_mode: latest_result
    transformation: &kyberswap_campaign_summary_transformation
      id: kyberswap_campaign_summary
      version: 1.0.0
      methodology_id: kyberswap_campaign_summary_v1
      script_path: scripts/prepare_kyberswap_campaign_summary.py
      tests_path: tests/test_kyberswap_campaign_summary.py
      fixture_path: studio/fixtures/query_8180894.json
      raw_data_file: raw_query_8180894.json
      source_required_columns: [rank_, key_]
    methodology:
      title: KyberSwap Campaign Summary
      description: The counters summarize referral deposits, current attributed balances, depositors, retention, new-depositor contribution, and partnership revenue for the selected period.
      metric_definitions:
        - Total Referral Deposits is referral-attributed deposit volume during the selected period.
        - Attributed TVL is the current ether.fi balance supportable by addresses that deposited during the selected period.
        - Referred Deposits by New Depositors is referral volume from wallets making their first ether.fi referral deposit.
        - "% Deposits by New Depositors is deposits_by_new_depositors divided by total_deposits_usd."
        - Total Depositors is the distinct count of referred wallets depositing during the selected period.
        - New Depositors is the distinct count of wallets whose first referral deposit occurred during the selected period.
        - Retention Rate is attributed TVL divided by selected-period referral deposits.
        - Revenue Generated is revenue attributed to the KyberSwap partnership.
      selected_period_logic:
        - Deposit metrics include referral deposits occurring during the selected period.
        - Total depositors include addresses depositing during the selected period.
        - New depositors are wallets whose first referral deposit occurs during the selected period.
        - Attributed TVL represents current balances supportable by addresses that deposited in that period.
        - Retention is attributed TVL divided by selected-period deposits.
        - Repeat depositors may have older balances, so outstanding attribution follows the documented campaign methodology.
      notes:
        - Dashboard periods map to key_ rows in the latest stored Dune result; unavailable periods and values display zero during development.
        - The export renames depositors_new_users_rate to deposits_by_new_depositors_rate without modifying the raw Dune result.
    value_column: total_deposits_usd
    compact_counter: true
    period_key_column: key_
    period_key_map: &kyberswap_campaign_period_key_map
      7D: 7d_data
      30D: 30d_data
      90D: 90d_data
      YTD: ytd_data
      1Y: 1y_data
      ALL: all_time_data
    export_name: KyberSwap Campaign Summary
    export_slug: kyberswap-campaign-summary
    export_columns:
      - key_
      - total_deposits_usd
      - outstanding_balance_usd
      - num_depositors
      - new_depositors
      - deposits_by_new_depositors
      - depositors_new_users_rate
      - retention_rate
      - revenue_generated
      - source_last_updated
    export_column_aliases:
      key_: period
      depositors_new_users_rate: deposits_by_new_depositors_rate
    source_label: Inspect Methodology
    last_updated: generated
    is_exportable: true
    default_visible: true
    display_order: 1
    format: currency_compact
    size: small

