    provider_mode: latest_result
    transformation: &kyberswap_attributed_holdings_transformation
      id: kyberswap_attributed_holdings
      version: 2.0.0
      methodology_id: kyberswap_attributed_holdings_v1
      script_path: scripts/enrich_kyberswap_attributed_holdings.py
      tests_path: tests/test_kyberswap_attributed_holdings.py
      fixture_path: studio/fixtures/query_8199058.json
      raw_data_file: raw_query_8199058.json
      source_required_columns:
        - day
        - address
        - strategy_symbol
        - base_asset
        - depositor_type
        - current_token
        - current_token_category
        - referral_balance
        - current_balance
        - previous_balance
    methodology: &kyberswap_attributed_holdings_methodology
      title: Referral attribution by current location
      description: Attribution is calculated separately for each wallet and deposited ether.fi product, then allocated deterministically across current destinations using values already measured in USD.
      definitions:
        - Protocol groups attributed_balance by current_token; Category groups the same values by current_token_category.
        - Empty positions without a category become Exited; non-empty positions without a category become Uncategorized.
      business_rules:
        - Existing pre-referral holdings are excluded once per wallet and deposited product using previous_balance.
        - Total attributed holdings cannot exceed referral_balance, and excess current balances remain unattributed.
        - Any referral amount unsupported by current holdings is classified deterministically as Exited.
      allocation_rules:
        - Current destinations use the existing deterministic attribution rules A through E.
        - Repeated group-level referral and previous balances are validated, counted once, and alphabetical ordering resolves ties.
      validation:
        - Every address and deposited-product group reconciles active attributed_balance plus Exited to referral_balance with exact decimal arithmetic.
        - Source amounts are already USD and are never multiplied by a base-asset price.
      notes:
        - Destination allocation is a deterministic attribution convention, not a claim of exact asset provenance.
        - base_asset is retained only as source metadata and does not change monetary values.
    growth_chart:
      kind: ranking
      period_column: day
      latest_period_only: true
      visible_category_limit: 6
      visible_others_label: Others
      preserve_categories: [Exited]
      preserve_uncategorized_when_material: true
      available_granularities: []
      default_view: protocol
      views:
        - id: protocol
          label: Protocol
          record_types: {total: "*"}
          dimension_column: current_token
          value_column: attributed_balance
          series_label: Attributed TVL
        - id: category
          label: Category
          record_types: {total: "*"}
          dimension_column: current_token_category
          value_column: attributed_balance
          series_label: Attributed TVL
      measures:
        - {column: attributed_balance, label: Attributed TVL, format: currency_compact, series_type: bar, color: green}
      export_columns: [grouping_type, destination, attributed_tvl_usd, source_day, source_last_updated]
      export_aliases: {grouping_type: selected_view, destination: dimension, attributed_tvl_usd: primary_value, source_day: period, source_last_updated: source_last_updated}
    source_label: Methodology
    export_name: Attributed TVL by Current Location
    export_slug: kyberswap-attributed-tvl-by-current-location
    last_updated: generated
    is_exportable: true
    default_visible: true
