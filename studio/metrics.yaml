          value_column: daily_deposits
        - id: depositor_type
          label: Depositor Type
          record_types: {total: daily_depositor_type}
          dimension_column: depositor_type
          dimension_order: [New Depositor, Existing Depositor, Past Depositor]
          value_column: daily_deposits
      measures:
        - {column: daily_deposits, label: Total referral deposits, format: currency_compact, series_type: bar, color: green}
      export_columns: [category_type, category, total_deposits_usd, dashboard_period]
      export_aliases: {category_type: selected_view, category: dimension, total_deposits_usd: primary_value, dashboard_period: dashboard_period}
