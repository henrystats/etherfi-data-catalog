name: etherfi_users
title: ether.fi Users
url: https://dune.com/ether_fi/etherfi-users
category: stake
show_in_core: true
description: Protocol-wide ether.fi user dashboard covering unique depositors, holders, active holders, retention, deposits, balances, onboarding products, and user activity across Stake and Liquid products.
tags:
  - users
  - holders
  - depositors
  - active-holders
  - retention
  - deposits
  - balances
  - onboarding
  - stake
  - liquid
  - lrt
  - protocol-wide
datasets:
  - dune.ether_fi.result_etherfi_protocol_events
  - dune.ether_fi.result_etherfi_protocol_token_holders
  - dune.ether_fi.result_etherfi_protocol_token_holders_with_defi
  - dune.ether_fi.result_etherfi_protocol_token_tvl
  - dune.ether_fi.result_etherfi_assets_under_management
  - dune.ether_fi.result_etherfi_addresses
  - dune.ether_fi.result_addresses_traits
metrics:
  - Total Protocol Unique Depositors
  - Total Protocol Unique Holders
  - Protocol Active Holders
  - Daily Unique Depositors by Depositor Type
  - Daily Deposits by Depositor Type
  - Daily Unique Holders by Holder Type
  - Daily Balances by Holder Type
  - ether.fi LRT Holders
  - ether.fi Liquid Holders
  - Protocol Retention Rates
  - LRT Retention Rates
  - Liquid Retention Rates
  - All Product Deposit Events
  - Deposits by New Depositors Across All ether.fi Products
  - Unique New Depositors
  - Top Onboarding Products
notes:
  - A unique depositor is an address that initiated a transaction staking ETH for eETH or depositing into ether.fi LRT and Yield Vault products.
  - Depositor type distinguishes new vs old (returning) depositors for daily depositor and deposit metrics.
  - Included products cover ether.fi Stake, LRT, and Liquid vault tokens such as eETH, weETHk, weETHs, eBTC, liquidBTC, liquidETH, liquidUSD, eEIGEN, liquidBeraBTC, liquidBeraETH, liquidMoveETH, UltraUSD, eUSD0++, liquidElixir, liquidKatanaETH, and eUSD.
  - A unique holder is an address that holds at least $10 worth of ether.fi LRT or Yield Vault tokens for at least one day.
  - Addresses that deposit weETH into tracked DeFi protocols such as Pendle, Zircuit, Swell, Aave, Mitosis, and Spark are included where covered.
  - Contract addresses are filtered out from holder counts, except Safes where applicable.
  - Active holders track the previous day's unique holder count using the same product and holder rules.
