name: weeth_utilization
title: weETH Utilization
url: https://dune.com/ether_fi/weeth-utilization
category: stake
description: Overview of weETH utilization across DeFi protocols, including supply share, protocol integrations, cross-chain usage, AUM, transfers, and holder distribution.
tags:
  - weeth
  - utilization
  - defi
  - stake
  - staking
  - holders
  - supply
  - cross-chain
  - aum
  - transfers
  - integrations
datasets:
  - dune.ether_fi.result_etherfi_protocol_token_tvl
  - dune.ether_fi.result_etherfi_protocol_token_holders
  - dune.ether_fi.result_etherfi_assets_under_management
  - dune.ether_fi.result_etherfi_addresses
  - dune.ether_fi.result_tokens_prices_tokens_list
  - dune.ether_fi.result_tokens_prices_usd
  - dune.ether_fi.result_addresses_traits
  - tokens_transfers_hourly
  - tokens_transfers
  - dune.ether_fi.result_tokens_exchange_rates_daily
notes:
  - A weETH supply percentage or share refers to eETH supply measured in weETH terms; for example, 50% means 50% of eETH supply expressed as weETH.
  - The dashboard tracks utilization across Ethereum and L2 ecosystems without treating a fixed chain list as complete.
  - weETH held in Ethereum bridge contracts may be excluded where appropriate to avoid overstating circulating or utilized supply.
  - The dashboard also uses Dune's `prices.usd` table outside the current catalog.
